services:
  # Marketplace database; the schema is created by Liquibase on application start
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cosmo_cats
      POSTGRES_USER: cosmo
      POSTGRES_PASSWORD: cosmo
    ports:
      # 5433 on the host: 5432 is often taken by a locally installed PostgreSQL
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Third-party Galactic Exchange service, stubbed by WireMock (see wiremock/mappings)
  exchange-rate-mock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock

volumes:
  postgres-data:
