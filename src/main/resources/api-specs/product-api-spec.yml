openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace — Product API
  description: |
    CRUD contract for products of the Cosmo Cats Intergalactic Marketplace.

    All errors are returned as RFC 9457 Problem Details (`application/problem+json`)
    with the members `type`, `title`, `status`, `detail` and `instance`.
    Validation problems additionally contain the extension member `errors`.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Products
    description: Product catalogue management

paths:
  /api/v1/products:
    get:
      tags: [Products]
      operationId: getProducts
      summary: Get a page of products
      description: Returns products ordered by id, wrapped in a paged envelope.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Page of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Product created
          headers:
            Location:
              description: URL of the created product
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by id
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Products]
      operationId: updateProduct
      summary: Replace an existing product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "422":
          $ref: "#/components/responses/CategoryNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Products]
      operationId: deleteProduct
      summary: Delete a product
      responses:
        "204":
          description: Product deleted, no content
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/products/{id}/price:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      operationId: getConvertedPrice
      summary: Get the product price converted to another currency
      description: The rate is fetched from the third-party Galactic Exchange service.
      parameters:
        - name: currency
          in: query
          required: true
          description: ISO 4217 currency code
          schema:
            type: string
            pattern: "^[A-Z]{3}$"
            example: EUR
      responses:
        "200":
          description: Converted price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertedPrice"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/ProductNotFound"
        "422":
          $ref: "#/components/responses/UnsupportedCurrency"
        "502":
          $ref: "#/components/responses/ExternalServiceError"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    ProductId:
      name: id
      in: path
      required: true
      description: Product identifier
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10

  schemas:
    ProductRequest:
      type: object
      required: [name, price, categoryId, sellerEmail]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: |
            Must contain at least one cosmic word (case-insensitive): star, galaxy, comet,
            planet, nebula, cosmic, cosmo, moon, orbit, asteroid, meteor, rocket, space,
            universe, solar, lunar, astro (validated by `@CosmicWordCheck`).
          example: Star Tuna Can
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Tuna caught near Sirius
        price:
          type: number
          description: Price as an exact decimal, greater than 0, with at most 2 fraction digits
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
          example: 9.99
        categoryId:
          type: integer
          format: int64
          example: 1
        sellerEmail:
          type: string
          format: email
          minLength: 1
          example: tuna@cosmocats.space

    ProductResponse:
      type: object
      required: [id, name, price, category, sellerEmail]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Star Tuna Can
        description:
          type: string
          nullable: true
          example: Tuna caught near Sirius
        price:
          type: number
          example: 9.99
        category:
          $ref: "#/components/schemas/Category"
        sellerEmail:
          type: string
          format: email
          example: tuna@cosmocats.space

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Space Food

    ProductPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProductResponse"
        page:
          type: integer
          format: int32
          description: Zero-based index of the returned page
          example: 0
        size:
          type: integer
          format: int32
          description: Requested page size
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total number of products across all pages
          example: 5

    ConvertedPrice:
      type: object
      required: [productId, currency, rate, amount]
      properties:
        productId:
          type: integer
          format: int64
          example: 1
        currency:
          type: string
          example: EUR
        rate:
          type: number
          example: 2
        amount:
          type: number
          description: Price multiplied by rate, rounded half-even to 2 decimals
          example: 19.98

    ProblemDetail:
      type: object
      description: RFC 9457 Problem Details object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
          example: https://cosmo-cats.market/errors/product-not-found
        title:
          type: string
          description: Short, human-readable summary of the problem type
          example: Product not found
        status:
          type: integer
          format: int32
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Explanation specific to this occurrence
          example: Product with id 999 was not found
        instance:
          type: string
          format: uri-reference
          description: URI of the request that caused the problem
          example: /api/v1/products/999

    ValidationProblemDetail:
      allOf:
        - $ref: "#/components/schemas/ProblemDetail"
        - type: object
          properties:
            errors:
              type: array
              description: Present when specific fields or parameters failed validation (absent for malformed JSON)
              items:
                $ref: "#/components/schemas/FieldViolation"
      example:
        type: https://cosmo-cats.market/errors/validation
        title: Validation failed
        status: 400
        detail: Field 'price' must be greater than 0. Field 'sellerEmail' must be a valid email address.
        instance: /api/v1/products
        errors:
          - field: price
            message: must be greater than 0
          - field: sellerEmail
            message: must be a valid email address

    FieldViolation:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: price
        message:
          type: string
          example: must be greater than 0

  responses:
    ValidationError:
      description: |
        Request is invalid. Field and parameter constraint violations, and JSON values of the
        wrong type (e.g. "price": "abc"), use type `validation` with the `errors` list.
        Broken JSON uses type `malformed-request`; a missing or non-numeric path/query parameter
        uses type `bad-request`; both come without `errors`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblemDetail"
    ProductNotFound:
      description: Product with the given id does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    CategoryNotFound:
      description: Referenced category does not exist
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: https://cosmo-cats.market/errors/category-not-found
            title: Category not found
            status: 422
            detail: Category with id 42 does not exist
            instance: /api/v1/products
    UnsupportedCurrency:
      description: The exchange rate service does not know the requested currency
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: https://cosmo-cats.market/errors/unsupported-currency
            title: Unsupported currency
            status: 422
            detail: Currency XYZ is not supported by the exchange rate service
            instance: /api/v1/products/1/price
    ExternalServiceError:
      description: The exchange rate service failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    InternalError:
      description: Unexpected server error; internal details are never exposed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: https://cosmo-cats.market/errors/internal
            title: Internal server error
            status: 500
            detail: An unexpected error occurred. Please contact support if the problem persists.
            instance: /api/v1/products
