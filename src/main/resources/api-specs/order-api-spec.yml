openapi: 3.0.3
info:
  title: Cosmo Cats Intergalactic Marketplace - Categories, Orders and Reports API
  description: |
    Categories, orders and sales reports, stored in PostgreSQL.

    Orders are addressed by their natural id `orderNumber` (UUID); the database surrogate
    key is never exposed. Errors follow RFC 9457 Problem Details, see product-api-spec.yml.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Categories
  - name: Orders
  - name: Reports

paths:
  /api/v1/categories:
    get:
      tags: [Categories]
      operationId: getCategories
      summary: List all categories ordered by name
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "201":
          description: Category created
          headers:
            Location:
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      operationId: getCategory
      summary: Get a category
      responses:
        "200":
          description: The category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Categories]
      operationId: updateCategory
      summary: Rename a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryRequest"
      responses:
        "200":
          description: Category renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Categories]
      operationId: deleteCategory
      summary: Delete an empty category
      responses:
        "204":
          description: Category deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/categories/{id}/products:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: [Categories]
      operationId: getCategoryProducts
      summary: Short list of the products of a category, ordered by name
      responses:
        "200":
          description: Products of the category
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place an order with the current product prices
      description: |
        The customer is identified by email and created on the first purchase.
        Repeated products are merged into one line. If any product does not exist,
        nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Order placed
          headers:
            Location:
              description: /api/v1/orders/{orderNumber}
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "422":
          $ref: "#/components/responses/UnknownProduct"

  /api/v1/orders/{orderNumber}:
    parameters:
      - $ref: "#/components/parameters/OrderNumber"
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order by its natural id
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Orders]
      operationId: deleteOrder
      summary: Delete an order with its items
      responses:
        "204":
          description: Order deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/orders/{orderNumber}/{action}:
    parameters:
      - $ref: "#/components/parameters/OrderNumber"
      - name: action
        in: path
        required: true
        description: |
          Status change. Allowed transitions: NEW -> PAID or CANCELLED, PAID -> SHIPPED or CANCELLED,
          SHIPPED -> DELIVERED.
        schema:
          type: string
          enum: [pay, ship, deliver, cancel]
    post:
      tags: [Orders]
      operationId: changeOrderStatus
      summary: Move an order through its lifecycle
      responses:
        "200":
          description: Order with the new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/reports/top-products:
    get:
      tags: [Reports]
      operationId: getTopSellingProducts
      summary: Most purchased products
      description: |
        Counts items of PAID, SHIPPED and DELIVERED orders only, ordered by total quantity
        (descending), then by product name.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Report rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductSales"
        "400":
          $ref: "#/components/responses/ValidationError"

components:
  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      description: Natural id of the order
      schema:
        type: string
        format: uuid

  schemas:
    CategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique among categories; surrounding spaces are removed
          example: Space Food
    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    ProductSummary:
      type: object
      required: [id, name, price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
    OrderRequest:
      type: object
      required: [customerEmail, items]
      properties:
        customerEmail:
          type: string
          format: email
          example: cat@cosmocats.space
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: "#/components/schemas/OrderItemRequest"
    OrderItemRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
          maximum: 1000
    Order:
      type: object
      required: [orderNumber, customerEmail, status, createdAt, items, total]
      properties:
        orderNumber:
          type: string
          format: uuid
        customerEmail:
          type: string
          format: email
        status:
          type: string
          enum: [NEW, PAID, SHIPPED, DELIVERED, CANCELLED]
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total:
          type: number
          description: Sum of item subtotals
    OrderItem:
      type: object
      required: [productId, productName, unitPrice, quantity, subtotal]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitPrice:
          type: number
          description: Price at the moment of purchase
        quantity:
          type: integer
        subtotal:
          type: number
    ProductSales:
      type: object
      required: [productId, productName, totalQuantity, totalRevenue]
      properties:
        productId:
          type: integer
          format: int64
        productName:
          type: string
        totalQuantity:
          type: integer
          format: int64
        totalRevenue:
          type: number
    ProblemDetail:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    ValidationError:
      description: Invalid request (type `validation`, with an `errors` list) or malformed path value (type `bad-request`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    NotFound:
      description: Category or order does not exist (`category-not-found`, `order-not-found`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    UnknownProduct:
      description: An order item references a product that does not exist (`unknown-product`)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    Conflict:
      description: |
        A business rule enforced by the database or the order lifecycle:
        `category-already-exists`, `category-in-use`, `invalid-order-status`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            type: https://cosmo-cats.market/errors/category-in-use
            title: Category in use
            status: 409
            detail: The category still has products; move or delete them first.
            instance: /api/v1/categories/1
