databaseChangeLog:
  - changeSet:
      id: 002-create-tables
      author: cosmo-cats
      comment: Initial 3NF schema - category, product, customer, orders, order_item
      changes:
        - createTable:
            tableName: category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_category
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_category_name

        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_product
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_category
                    references: category(id)
              - column:
                  name: seller_email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE product ADD CONSTRAINT ck_product_price_positive CHECK (price > 0)

        - createTable:
            tableName: customer
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_customer
              - column:
                  name: email
                  type: VARCHAR(254)
                  constraints:
                    nullable: false

        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
              - column:
                  name: order_number
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_orders_order_number
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_orders_customer
                    references: customer(id)
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              ALTER TABLE orders ADD CONSTRAINT ck_orders_status
              CHECK (status IN ('NEW', 'PAID', 'SHIPPED', 'DELIVERED', 'CANCELLED'))

        - createTable:
            tableName: order_item
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_order_item
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_item_order
                    references: orders(id)
                    deleteCascade: true
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_order_item_product
                    references: product(id)
              - column:
                  name: unit_price
                  type: NUMERIC(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - sql:
            sql: ALTER TABLE order_item ADD CONSTRAINT ck_order_item_quantity_positive CHECK (quantity > 0)

        # PostgreSQL does not index foreign key columns automatically
        - createIndex:
            tableName: product
            indexName: idx_product_category_id
            columns:
              - column:
                  name: category_id
        - createIndex:
            tableName: orders
            indexName: idx_orders_customer_id
            columns:
              - column:
                  name: customer_id
        - createIndex:
            tableName: order_item
            indexName: idx_order_item_order_id
            columns:
              - column:
                  name: order_id
        - createIndex:
            tableName: order_item
            indexName: idx_order_item_product_id
            columns:
              - column:
                  name: product_id
