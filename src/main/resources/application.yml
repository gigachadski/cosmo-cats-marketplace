spring:
  application:
    name: cosmo-cats-marketplace
  jackson:
    mapper:
      # Jackson 3 sorts properties alphabetically by default; keep declaration order
      # so problem details read as type, title, status, detail, instance.
      sort-properties-alphabetically: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cosmo_cats}
    username: ${DB_USERNAME:cosmo}
    password: ${DB_PASSWORD:cosmo}
  jpa:
    # Liquibase owns the schema; Hibernate only checks that the entities match it
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys of the authorization server (WireMock in docker-compose serves a JWKS file)
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8089/.well-known/jwks.json}
          # Tokens from any other issuer are rejected
          issuer-uri: ${JWT_ISSUER:https://auth.cosmo-cats.market}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    # "demo" loads the sample catalogue; tests use the "test" context and start empty
    contexts: demo

# Feature toggles: a disabled feature answers 404 "feature-not-available"
feature:
  cosmoCats:
    enabled: true
  kittyProducts:
    enabled: false

server:
  port: 8080

cosmo:
  security:
    # Machine clients of the reports API: name -> key, sent in the X-API-Key header
    api-keys:
      committee: ${COMMITTEE_API_KEY:dev-committee-key-change-me}
  clients:
    exchange-rate:
      base-url: http://localhost:8089
      connect-timeout: 2s
      read-timeout: 5s
